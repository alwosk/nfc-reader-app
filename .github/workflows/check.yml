name: Check source
on: [push, pull_request]
jobs:
  receiver:
    strategy:
      matrix:
        python: ['3.12', '3.14']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r pc/requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest' && matrix.python == '3.12'
        with:
          name: windows-receiver-v0.4.0
          path: |
            pc/*.py
            pc/*.ps1
            pc/*.cmd
            pc/requirements.txt
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - run: ./gradlew assembleDebug lintDebug testDebugUnitTest
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: attendance-ci-debug-apk-not-for-updating-existing-install
          path: android/app/build/outputs/apk/debug/app-debug.apk
